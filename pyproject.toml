[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopcheck"
version = "0.1.0"
description = "Check whether packages actually exist on PyPI before you install AI-suggested dependencies."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
slopcheck = "slopcheck.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
