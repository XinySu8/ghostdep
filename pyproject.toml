[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdep"
version = "0.1.0"
description = "Check whether packages actually exist on PyPI before you install AI-suggested dependencies."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "mcp>=2.0",
]

[project.scripts]
ghostdep = "ghostdep.cli:main"
ghostdep-mcp = "ghostdep.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghostdep = ["data/popular_packages.txt"]
